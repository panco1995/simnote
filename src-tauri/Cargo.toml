[package]
name = "simnote"
version = "0.1.0"
description = "A minimalist note-taking app with a retro 90s look"
license = "MIT"
edition = "2021"

[lib]
name = "simnote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
